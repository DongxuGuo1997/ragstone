name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    services:
      # Live Postgres+pgvector so the PgVectorProxy tests run instead of
      # skipping (they skip cleanly wherever RAGSTONE_PG_URL is unset).
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ragstone
          POSTGRES_PASSWORD: ragstone
          POSTGRES_DB: ragstone
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ragstone"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package with dev dependencies
        run: |
          python -m pip install --upgrade pip
          # sqlite extra included so mypy can resolve langgraph.checkpoint.sqlite
          # (optional-backend import in rag/memory.py) and so the SQLite
          # persistence test runs instead of being skipped. api extra included
          # so the REST API tests run instead of being skipped. qdrant runs
          # embedded (no server); pgvector talks to the service container.
          pip install -e ".[dev,sqlite,api,qdrant,pgvector]"

      - name: Lint (black, isort, flake8)
        run: |
          black --check src/ tests/
          isort --check-only src/ tests/
          flake8 src/ tests/

      - name: Type check (mypy)
        run: mypy src/ragstone

      - name: Run tests
        env:
          RAGSTONE_PG_URL: postgresql+psycopg://ragstone:ragstone@localhost:5432/ragstone
        run: pytest tests/ -v

  eval-retrieval:
    # Retrieval-quality regression gate: embeds the eval corpus and checks
    # hit rate / MRR against evals/baseline.json (fails on a drop). Needs an
    # OpenAI key for embeddings (fractions of a cent per run), so it runs
    # only where the secret is available — pushes and same-repo PRs, not
    # forks. The in-step guard also makes it a clean skip on clones that
    # have no OPENAI_API_KEY secret configured.
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run retrieval eval against baseline
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::notice::OPENAI_API_KEY secret not configured - skipping retrieval eval"
            exit 0
          fi
          python evals/run_eval.py --mode retrieval

  supply-chain:
    # ROADMAP 5.8: fail on known CVEs in the resolved dependency set.
    # The allowlist (.github/audit-allowlist.txt) grants time-boxed
    # exceptions only: every entry carries an expiry date and the job
    # goes red when one lapses, so an ignored CVE can never quietly
    # become permanent. Audits the same extras the test job installs
    # (rerank excluded: it pins torch, which no CI job here ships).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime dependency set
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[sqlite,api,qdrant,pgvector,otel]"

      - name: pip-audit with expiring allowlist
        run: |
          pip install pip-audit
          today=$(date -u +%F)
          ignores=()
          while read -r vuln expiry _reason; do
            case "$vuln" in ''|\#*) continue ;; esac
            if [ -z "$expiry" ]; then
              echo "::error::Allowlist entry $vuln has no expiry date"
              exit 1
            fi
            if [[ "$expiry" < "$today" ]]; then
              echo "::error::Allowlist entry $vuln expired on $expiry — upgrade the dep or re-justify the entry"
              exit 1
            fi
            echo "Ignoring $vuln until $expiry"
            ignores+=(--ignore-vuln "$vuln")
          done < .github/audit-allowlist.txt
          pip-audit --skip-editable "${ignores[@]}"
