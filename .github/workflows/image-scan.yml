# ROADMAP 5.8, container half: scan the built image for known CVEs.
# Separate workflow from ci.yml because the triggers differ: the image
# only changes when Dockerfile/pyproject do, but new CVEs appear against
# an UNCHANGED image, so a weekly run covers the gap between pushes.
name: Image scan

on:
  push:
    branches: [main]
    paths: ["Dockerfile", "pyproject.toml", ".github/workflows/image-scan.yml"]
  pull_request:
    paths: ["Dockerfile", "pyproject.toml", ".github/workflows/image-scan.yml"]
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC, on the default branch

jobs:
  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t ragstone:scan .

      - name: Scan with Trivy
        # Pinned by commit SHA (= v0.36.0): a security workflow should not
        # trust a movable tag on the very action that does the scanning.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ragstone:scan
          format: table
          exit-code: "1"
          # ignore-unfixed: a Debian base always carries CVEs with no
          # released fix; failing on those would be a permanent red that
          # trains everyone to ignore the job. Fixable HIGH/CRITICAL only.
          ignore-unfixed: true
          severity: CRITICAL,HIGH
