[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ragstone"
version = "2.1.0"
description = "Efficient RAG engine for grounded Q&A — OpenAI/Ollama backends, FAISS/Chroma stores, built-in eval harness, Streamlit UI, and MCP server"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Dongxu Guo", email = "ericguohit@outlook.com"}
]
maintainers = [
    {name = "Dongxu Guo", email = "ericguohit@outlook.com"}
]
keywords = ["rag", "langchain", "llm", "openai", "ollama", "vector-store", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.10"
dependencies = [
    # ============================================
    # LangChain Dependencies - PINNED FOR STABILITY
    # ============================================
    # Pin to major versions (allows minors/patches, blocks breaking changes)
    # Current tested versions: 1.x (community 0.4.x)
    # Compatibility smoke tests: pytest tests/test_langchain_compatibility.py
    "langchain>=1.0,<2.0",
    "langchain-core>=1.0,<2.0",
    # langchain-community is being sunset upstream; we use it for BM25,
    # the web/wiki loaders, and the FAISS wrapper, none of which have
    # standalone package homes yet (checked 2026-07). The pin holds the
    # working line and tests/test_langchain_compatibility.py is the
    # tripwire; migrate when upstream ships replacements (ROADMAP 7).
    "langchain-community>=0.4,<0.5",
    "langchain-classic>=1.0,<2.0",
    "langchain-openai>=1.0,<2.0",
    "langchain-ollama>=1.0,<2.0",
    "langchain-text-splitters>=1.0,<2.0",
    "langchain-chroma>=1.0,<2.0",
    "langgraph>=1.0,<2.0",

    # UI Framework
    "streamlit>=1.28.0,<2.0.0",

    # Core Utilities
    "python-dotenv>=1.0.0,<2.0.0",

    # Vector Stores & Retrieval
    "chromadb>=1.3.5,<2.0.0",
    "faiss-cpu>=1.9.0,<2.0.0",
    "rank-bm25>=0.2.2,<1.0.0",

    # Document Loaders
    "beautifulsoup4>=4.12.0,<5.0.0",
    "wikipedia>=1.4.0,<2.0.0",
    # Floor raised by the supply-chain gate (July 2026): every 5.x carries
    # known CVEs fixed only in 6.x. Extraction diff 5->6 verified: spacing
    # placement only, no content change (22-page probe PDF).
    "pypdf>=6.13.3,<7.0.0",
    "docx2txt>=0.8,<1.0.0",
    "html2text>=2020.1.16",

    # Data Processing
    "numpy>=1.26.0,<3.0.0",

    # HTTP/Async
    "requests>=2.31.0,<3.0.0",
    "aiohttp>=3.9.0,<4.0.0",

    # MCP Protocol
    "mcp>=1.0.0,<2.0.0",
]

[project.optional-dependencies]
rerank = [
    "sentence-transformers>=2.2.0",
]
sqlite = [
    # Durable conversation memory (survives restarts). The 3.x line targets
    # langgraph-checkpoint 4.x, matching langgraph 1.x; the 2.x line pins
    # checkpoint <3 and will silently downgrade/break langgraph 1.x.
    "langgraph-checkpoint-sqlite>=3.1,<4.0",
]
api = [
    # REST serving layer (ragstone-api console script).
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
    # /metrics endpoint (pure-Python, no transitive deps).
    "prometheus-client>=0.19,<2.0",
]
qdrant = [
    # Qdrant vector store: embedded local mode by default (QDRANT_PATH),
    # or a server via QDRANT_URL — same code path.
    "qdrant-client>=1.14,<2.0",
    "langchain-qdrant>=1.0,<2.0",
]
pgvector = [
    # pgvector store: needs a Postgres with the pgvector extension
    # (RAGSTONE_PG_URL; docker-compose.yml provides one).
    "langchain-postgres>=0.0.15,<0.1",
    "psycopg[binary]>=3.1,<4.0",
]
otel = [
    # Distributed tracing: each ask becomes a span with stage children.
    # Instrumentation is built in and no-op; this extra adds the SDK and
    # OTLP/HTTP exporter that main() wires when OTEL_EXPORTER_OTLP_ENDPOINT
    # is set.
    "opentelemetry-sdk>=1.20,<2.0",
    "opentelemetry-exporter-otlp-proto-http>=1.20,<2.0",
]
all = [
    # Every runtime extra (not dev tooling). Keep in sync with the
    # feature extras above.
    "ragstone[rerank,sqlite,api,qdrant,pgvector,otel]",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.5.0",
    "pre-commit>=3.0.0",
    "jupyter>=1.0.0",
    "ipykernel>=6.25.0",
]
[project.urls]
Homepage = "https://github.com/DongxuGuo1997/ragstone"
Documentation = "https://github.com/DongxuGuo1997/ragstone#readme"
Repository = "https://github.com/DongxuGuo1997/ragstone.git"
Issues = "https://github.com/DongxuGuo1997/ragstone/issues"

[project.scripts]
ragstone = "ragstone.ui.streamlit_app:main"
ragstone-mcp = "ragstone.mcp.mcp_server_fastmcp:main"
ragstone-chat = "ragstone.ui.chat_interface:main"
ragstone-api = "ragstone.api.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["ragstone"]

[tool.mypy]
# No pinned python_version: mypy targets the interpreter it runs under.
# Pinning 3.10 breaks on Python 3.12 runners, where the freshly installed
# numpy (>=2.5) ships stubs using PEP 695 `type` statements that are
# invalid under a 3.10 target. The CI 3.10 matrix leg still guards our own
# 3.10 compatibility, since mypy runs under 3.10 there.
warn_unused_configs = true
no_implicit_optional = true
warn_redundant_casts = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "chromadb.*",
    "wikipedia.*",
    "streamlit.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/test_*.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
] 