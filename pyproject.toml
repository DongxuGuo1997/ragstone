[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "langchain-rag-pipeline"
version = "2.0.0"
description = "RAG pipeline with OpenAI/Ollama backends, FAISS/Chroma vector stores, Streamlit UI, and MCP server integration"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Dongxu Guo", email = "ericguohit@outlook.com"}
]
maintainers = [
    {name = "Dongxu Guo", email = "ericguohit@outlook.com"}
]
keywords = ["rag", "langchain", "llm", "openai", "ollama", "vector-store", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.10"
dependencies = [
    # ============================================
    # LangChain Dependencies - PINNED FOR STABILITY
    # ============================================
    # Pin to major versions (allows minors/patches, blocks breaking changes)
    # Current tested versions: 1.x (community 0.4.x)
    # Compatibility smoke tests: pytest tests/test_langchain_compatibility.py
    "langchain>=1.0,<2.0",
    "langchain-core>=1.0,<2.0",
    "langchain-community>=0.4,<0.5",
    "langchain-classic>=1.0,<2.0",
    "langchain-openai>=1.0,<2.0",
    "langchain-ollama>=1.0,<2.0",
    "langchain-text-splitters>=1.0,<2.0",
    "langchain-chroma>=1.0,<2.0",

    # UI Framework
    "streamlit>=1.28.0,<2.0.0",

    # Core Utilities
    "python-dotenv>=1.0.0,<2.0.0",

    # Vector Stores & Retrieval
    "chromadb>=1.3.5,<2.0.0",
    "faiss-cpu>=1.9.0,<2.0.0",
    "rank-bm25>=0.2.2,<1.0.0",

    # Document Loaders
    "beautifulsoup4>=4.12.0,<5.0.0",
    "wikipedia>=1.4.0,<2.0.0",
    "pypdf>=4.0.0,<6.0.0",
    "docx2txt>=0.8,<1.0.0",
    "html2text>=2020.1.16",

    # Data Processing
    "numpy>=1.26.0,<3.0.0",

    # HTTP/Async
    "requests>=2.31.0,<3.0.0",
    "aiohttp>=3.9.0,<4.0.0",

    # MCP Protocol
    "mcp>=1.0.0,<2.0.0",
]

[project.optional-dependencies]
rerank = [
    "sentence-transformers>=2.2.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.5.0",
    "pre-commit>=3.0.0",
    "jupyter>=1.0.0",
    "ipykernel>=6.25.0",
]
[project.urls]
Homepage = "https://github.com/DongxuGuo1997/langchain-rag-pipeline"
Documentation = "https://github.com/DongxuGuo1997/langchain-rag-pipeline#readme"
Repository = "https://github.com/DongxuGuo1997/langchain-rag-pipeline.git"
Issues = "https://github.com/DongxuGuo1997/langchain-rag-pipeline/issues"

[project.scripts]
langchain-rag = "langchain_rag.ui.streamlit_app:main"
rag-mcp-server = "langchain_rag.mcp.mcp_server_fastmcp:main"
rag-chat = "langchain_rag.ui.chat_interface:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["langchain_rag"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
no_implicit_optional = true
warn_redundant_casts = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "chromadb.*",  
    "faiss.*",
    "wikipedia.*",
    "streamlit.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/test_*.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
] 