# High-Performance RAG Pipeline Configuration

# Environment
environment: production
debug: false

# API Configuration
api:
  openai_api_key: ${OPENAI_API_KEY}
  openai_org_id: ${OPENAI_ORG_ID:}
  anthropic_api_key: ${ANTHROPIC_API_KEY:}

# LLM Configuration
llm:
  default_provider: openai
  default_temperature: 0.7
  max_tokens: 2000
  timeout: 30
  
  # Model-specific settings
  openai:
    model: gpt-3.5-turbo
    max_retries: 3
    request_timeout: 60
    
  ollama:
    model: llama3
    base_url: http://localhost:11434
    keep_alive: 5m

# Vector Database Configuration
database:
  default_type: optimized  # Use optimized vector store
  batch_size: 100
  similarity_k: 10
  
  # Optimized settings
  optimized:
    dimension: 1536
    max_workers: 4
    use_gpu: true
    enable_mmap: true
    index_path: indexes/production
    
  faiss:
    index_type: IVF
    nlist: 100
    nprobe: 10
    
  chroma:
    persist_directory: ./chroma_db_production
    collection_name: production_docs

# Performance Configuration
performance:
  # Async settings
  max_concurrent_requests: 100
  request_timeout: 30
  
  # Connection pooling
  connection_pool:
    max_connections: 200
    max_keepalive: 50
    timeout: 60
    
  # Request batching
  batching:
    enabled: true
    batch_size: 50
    batch_timeout: 0.1
    max_pending: 1000
    
  # Circuit breaker
  circuit_breaker:
    enabled: true
    failure_threshold: 5
    recovery_timeout: 60
    
  # Resource limits
  resources:
    max_memory_mb: 4096
    max_cpu_percent: 80
    
# Cache Configuration
cache:
  # Multi-level cache
  enable_semantic_cache: true
  
  # L1 Cache (Memory)
  l1:
    max_size: 10000
    max_memory_mb: 500
    ttl_seconds: 3600
    
  # L2 Cache (Redis)
  l2:
    enabled: true
    redis_url: ${REDIS_URL:redis://localhost:6379}
    key_prefix: "rag:prod:"
    ttl_seconds: 86400
    
  # Cache settings
  similarity_threshold: 0.95
  exact_match_bonus: 0.05
  cache_embeddings: true
  max_embedding_cache: 50000

# Document Loading Configuration
loader:
  default_data_dir: ./data
  chunk_size: 500
  chunk_overlap: 100
  
  # Performance settings
  parallel_loading: true
  max_workers: 8
  batch_size: 100
  
  # File type settings
  pdf:
    extract_images: false
    ocr_enabled: false
    
  web:
    timeout: 30
    max_retries: 3
    user_agent: "LangChain-RAG/2.0"

# Monitoring Configuration
monitoring:
  enabled: true
  
  # Metrics collection
  metrics:
    collect_system_metrics: true
    system_metrics_interval: 60
    max_history: 100000
    
  # Health checks
  health:
    enabled: true
    endpoint: /health
    check_interval: 30
    
  # Alerts
  alerts:
    enabled: true
    rules:
      - name: high_error_rate
        threshold: 0.05
        window: 300
        severity: critical
        
      - name: slow_response
        threshold: 5.0
        window: 300
        severity: warning
        
      - name: high_memory
        threshold: 85
        window: 60
        severity: warning
        
  # Logging
  logging:
    level: INFO
    format: json
    
    # Structured logging
    structured:
      enabled: true
      include_trace_id: true
      include_metadata: true
      
    # Log destinations
    destinations:
      - type: console
        level: INFO
        
      - type: file
        level: DEBUG
        path: logs/rag_pipeline.log
        max_size_mb: 100
        max_files: 10
        
      - type: elasticsearch
        enabled: false
        url: ${ELASTICSEARCH_URL:}
        index: rag-logs

# UI Configuration
ui:
  title: "High-Performance RAG Pipeline"
  
  # Performance optimizations
  enable_caching: true
  lazy_loading: true
  debounce_ms: 300
  
  # Rate limiting
  rate_limit:
    enabled: true
    requests_per_minute: 60
    burst: 10

# Security Configuration
security:
  # Input validation
  max_query_length: 10000
  max_document_size_mb: 50
  allowed_file_types:
    - pdf
    - txt
    - md
    - docx
    - csv
    
  # Sanitization
  sanitize_inputs: true
  remove_html: true
  
  # Rate limiting
  rate_limiting:
    enabled: true
    window_seconds: 60
    max_requests: 100

# Deployment Configuration
deployment:
  # Auto-scaling
  auto_scaling:
    enabled: true
    min_instances: 2
    max_instances: 10
    target_cpu: 70
    target_memory: 80
    
  # Load balancing
  load_balancer:
    algorithm: round_robin
    health_check_path: /health
    health_check_interval: 10
    
  # Graceful shutdown
  shutdown:
    timeout: 30
    drain_timeout: 15

# Feature Flags
features:
  enable_gpu_acceleration: true
  enable_memory_mapping: true
  enable_request_coalescing: true
  enable_predictive_caching: true
  enable_adaptive_batching: true
  enable_circuit_breaker: true
  enable_distributed_tracing: true

# Optimization Presets
optimization_preset: maximum_performance

# Preset configurations
presets:
  maximum_performance:
    cache.l1.max_size: 50000
    cache.l2.enabled: true
    performance.max_concurrent_requests: 200
    performance.batching.batch_size: 100
    loader.max_workers: 16
    
  balanced:
    cache.l1.max_size: 10000
    cache.l2.enabled: true
    performance.max_concurrent_requests: 100
    performance.batching.batch_size: 50
    loader.max_workers: 8
    
  low_resource:
    cache.l1.max_size: 1000
    cache.l2.enabled: false
    performance.max_concurrent_requests: 20
    performance.batching.batch_size: 10
    loader.max_workers: 2